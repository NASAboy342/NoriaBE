
name: Deploy

on:
  push:
    branches: [ master ]

env:
  repositoryDir: D:\Clones\NoriaBe
  projectDir: D:\Clones\NoriaBe\NoriaBE\NoriaBE
  destinationDir: D:\Websites\NoriaBE
  publishDir: D:\Clones\NoriaBe\NoriaBE\NoriaBE\bin\Release\net8.0

jobs:
  test-runner:
    runs-on: self-hosted  # This will use your self-hosted runner
    
    steps:
    - name: Pull Repository
      shell: powershell
      run: |
        Write-Host "Going to repository directory..."
        cd "${{ env.repositoryDir }}"
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Pulling latest code..."
        git pull origin master

    - name: Build
      shell: powershell
      run: |
        Write-Host "Going to project directory..."
        cd "${{ env.projectDir }}"
        Write-Host "Building"
        dotnet build
      

    - name: Deploy Application
      shell: powershell
      run: |
        Write-Host "Going to project directory..."
        cd "${{ env.projectDir }}"
        Stop-WebAppPool -Name "apini"
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "Publish application..."
        dotnet publish -c Release -o "${{ env.publishDir }}"
        Write-Host "Publish completed successfully!"
        Write-Host "Ready to copy build to deployment directory..."
        Copy-Item -Path "${{ env.publishDir }}/*" -Destination "${{ env.destinationDir }}" -Recurse -Force
        Start-WebAppPool -Name "apini"
        Write-Host "Deployment completed successfully!"
